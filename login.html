<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFROI</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Boxicons CSS -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #EBDCB2;
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar-custom {
      background-color: #7b5836;
    }

    .nav-link {
      color: white;
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #EBDCB2;
    }

    .menu-links {
      background-color: #ffffff;
      flex-wrap: wrap;
      gap: 10px;
    }

    .menu-links a {
      text-decoration: none;
      padding: 10px 15px;
      color: #7b5836;
      font-weight: 500;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .menu-links a:hover {
      background-color: #EBDCB2;
      border-radius: 5px;
      color: #5e4024;
    }

    .logo {
      max-height: 60px;
    }

    .title {
      background-color: #EBDCB2;
      text-align: center;
      padding: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #5e4024;
    }

    @media (max-width: 576px) {
      .nav-link {
        font-size: 1.2rem;
      }
      .title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Título superior -->
  <div class="title">Asociación Afrocolombiana de Itagüí</div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom px-3">
    <div class="container-fluid">
      <a class="navbar-brand text-white d-flex align-items-center d-lg-none" href="#">
        <img src="AFROI2.png" alt="Logo" class="logo me-2" />
        <span class="fs-4">AFROI</span>
      </a>

      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="navbarContent">
        <div class="d-flex">
          <a class="nav-link" href="#"><i class='bx bxl-facebook'></i></a>
          <a class="nav-link" href="#"><i class='bx bxl-instagram'></i></a>
          <a class="nav-link" href="#"><i class='bx bxl-twitter'></i></a>
        </div>

        <div class="d-none d-lg-flex mx-auto align-items-center">
          <img src="AFROI2.png" alt="Logo" class="logo me-2" />
          <span class="text-white fs-4">AFROI</span>
        </div>

        <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0 flex-wrap">
          <a href="login.html" class="nav-link text-white" style="font-size: 1rem;">Iniciar Sesión</a>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Buscar" />
            <button class="btn btn-outline-light" type="submit"><i class='bx bx-search'></i></button>
          </form>
        </div>
      </div>
    </div>
  </nav>

  <!-- Menú de secciones -->
  <div class="d-flex justify-content-center menu-links py-2 px-2">
    <a href="index.html">Inicio</a>
    <a href="index.html#Quiénes Somos">¿Quiénes Somos?</a>
    <a href="index.html#valores">Valores</a>
    <a href="index.html#contacto">Contacto</a>
    <a href="#">Emprendimiento</a>
    <a href="registro.html">Registrarse</a>
  </div>

<!-- Sección de Registro de Usuario -->
<section class="py-5">
  <div class="container">
    <div class="row align-items-center justify-content-center">
      
      <!-- Columna 1: Imagen (lado izquierdo) -->
      <div class="col-md-5 mb-4 mb-md-0">
        <img src="ai-generated-8969022_1280.jpg" alt="Imagen de Registro" class="img-fluid rounded shadow">
      </div>

      <!-- Columna 2: Formulario de Registro (lado derecho) -->
      <div class="col-md-5 bg-white rounded p-4 shadow ms-md-5 register-area">
        <h2 class="fw-bold mb-4 text-center" style="color: #7b5836;">Ingresa tu Cuenta</h2>
        <form>
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text"><i class="bx bx-user"></i></span>
              <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre completo">
            </div>
          </div>
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text"><i class="bx bx-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico">
            </div>
          </div>
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text"><i class="bx bx-lock"></i></span>
              <input type="password" class="form-control" id="contraseña" placeholder="Ingresa tu contraseña">
            </div>
          </div>
     
          <button type="submit" class="btn text-white w-100" style="background-color: #7b5836; font-size: 1rem;">Iniciar Seccion</button>
        </form>
      </div>

    </div>
  </div>
</section>


<!-- Agregar efectos CSS -->
<style>
  /* Efecto de hover para el área de registro/login */
  .register-area {
    transition: all 0.3s ease;
  }

  .register-area:hover {
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    transform: scale(1.03);
    background-color: #f4f1e0; /* Cambio de color al pasar el cursor */
  }
</style>

  
 <!-- Footer -->
<footer class="text-white text-center py-3" style="background-color: #7b5836;">
    <div class="container">
      <p class="mb-1">© 2025 AFROI. Todos los derechos reservados.</p>
      <div>
        <a href="#" class="text-white me-3"><i class='bx bxl-facebook'></i></a>
        <a href="#" class="text-white me-3"><i class='bx bxl-instagram'></i></a>
        <a href="#" class="text-white me-3"><i class='bx bxl-twitter'></i></a>
      </div>
    </div>
  </footer>
  

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
