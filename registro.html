<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFROI</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Boxicons CSS -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #EBDCB2;
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar-custom {
      background-color: #7b5836;
    }

    .nav-link {
      color: white;
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #EBDCB2;
    }

    .menu-links {
      background-color: #ffffff;
      flex-wrap: wrap;
      gap: 10px;
    }

    .menu-links a {
      text-decoration: none;
      padding: 10px 15px;
      color: #7b5836;
      font-weight: 500;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .menu-links a:hover {
      background-color: #EBDCB2;
      border-radius: 5px;
      color: #5e4024;
    }

    .logo {
      max-height: 60px;
    }

    .title {
      background-color: #EBDCB2;
      text-align: center;
      padding: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      color: #5e4024;
    }

    @media (max-width: 576px) {
      .nav-link {
        font-size: 1.2rem;
      }

      .title {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- Título superior -->
  <div class="title">Asociación Afrocolombiana de Itagüí</div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom px-3">
    <div class="container-fluid">
      <a class="navbar-brand text-white d-flex align-items-center d-lg-none" href="#">
        <img src="AFROI2.png" alt="Logo" class="logo me-2" />
        <span class="fs-4">AFROI</span>
      </a>

      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="navbarContent">
        <div class="d-flex">
          <a class="nav-link" href="#"><i class='bx bxl-facebook'></i></a>
          <a class="nav-link" href="#"><i class='bx bxl-instagram'></i></a>
          <a class="nav-link" href="#"><i class='bx bxl-twitter'></i></a>
        </div>

        <div class="d-none d-lg-flex mx-auto align-items-center">
          <img src="AFROI2.png" alt="Logo" class="logo me-2" />
          <span class="text-white fs-4">AFROI</span>
        </div>

        <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0 flex-wrap">
          <a href="login.html" class="nav-link text-white" style="font-size: 1rem;">Iniciar Sesión</a>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Buscar" />
            <button class="btn btn-outline-light" type="submit"><i class='bx bx-search'></i></button>
          </form>
        </div>
      </div>
    </div>
  </nav>

  <!-- Menú de secciones -->
  <div class="d-flex justify-content-center menu-links py-2 px-2">
    <a href="index.html">Inicio</a>
    <a href="index.html#Quiénes Somos">¿Quiénes Somos?</a>
    <a href="index.html#valores">Valores</a>
    <a href="index.html#contacto">Contacto</a>
    <a href="#">Emprendimiento</a>
    <a href="registro.html">Registrarse</a>
  </div>

  <!-- Sección de Registro de Usuario -->
  <section class="py-5"
    style="background-image: url('Imagenes/fondo-registro.jpg'); background-size: cover; background-position: center;">
    <div class="container">
      <div class="row align-items-center justify-content-center">

        <!-- Columna 1: Imagen -->
        <div class="col-md-5 mb-4 mb-md-0">
          <img src="foto registro.jpg" alt="Imagen de Registro" class="img-fluid rounded shadow">
        </div>

        <!-- Columna 2: Formulario -->
        <div class="col-md-6 bg-white bg-opacity-75 rounded p-4 shadow ms-md-5">
          <h2 class="fw-bold mb-4 text-center" style="color: #7b5836;">Registro de Usuario</h2>
          <form>

            <!-- Nombre completo -->
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text"><i class="bx bx-user"></i></span>
                <input type="text" class="form-control" placeholder="Nombre completo" required>
              </div>
            </div>

            <!-- Tipo de documento -->
            <div class="mb-3">
              <div class="input-group">
                <label class="input-group-text"><i class="bx bx-id-card"></i></label>
                <select class="form-select" required>
                  <option selected disabled>Tipo de Documento</option>
                  <option>Cédula de Ciudadanía</option>
                  <option>Tarjeta de Identidad</option>
                  <option>Cédula de Extranjería</option>
                </select>
              </div>
            </div>

            <!-- Fecha de nacimiento -->
            <div class="mb-3 row">
              <label class="mb-1" style="color: #7b5836;">Fecha de Nacimiento</label>
              <div class="col-4">
                <select class="form-select" required>
                  <option disabled selected>Mes</option>
                  <option>Enero</option>
                  <option>Febrero</option>
                  <option>Marzo</option>
                  <option>Abril</option>
                  <option>Mayo</option>
                  <option>Junio</option>
                  <option>Julio</option>
                  <option>Agosto</option>
                  <option>Septiembre</option>
                  <option>Octubre</option>
                  <option>Noviembre</option>
                  <option>Diciembre</option>
                </select>
              </div>
              <div class="col-4">
                <select class="form-select" required id="dia">
                  <option disabled selected>Día</option>
                </select>
              </div>
              <div class="col-4">
                <select class="form-select" required id="año">
                  <option disabled selected>Año</option>
                </select>
              </div>
            </div>

            <!-- Correo electrónico -->
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text"><i class="bx bx-envelope"></i></span>
                <input type="email" class="form-control" placeholder="Correo electrónico" required>
              </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text"><i class="bx bx-lock"></i></span>
                <input type="password" class="form-control" placeholder="Contraseña" required>
              </div>
            </div>

            <!-- Confirmar contraseña -->
            <div class="mb-3">
              <div class="input-group">
                <span class="input-group-text"><i class="bx bx-lock-alt"></i></span>
                <input type="password" class="form-control" placeholder="Confirmar contraseña" required>
              </div>
            </div>

            <!-- Nivel académico -->
            <div class="mb-3">
              <div class="input-group">
                <label class="input-group-text"><i class="bx bx-book-bookmark"></i></label>
                <select class="form-select" required>
                  <option selected disabled>Nivel Académico</option>
                  <option>Bachiller</option>
                  <option>Técnico</option>
                  <option>Tecnólogo</option>
                  <option>Profesional</option>
                  <option>Especialista</option>
                  <option>Magíster</option>
                </select>
              </div>
            </div>

            <!-- Título -->
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Escribe tu título académico">
            </div>

            <!-- Botón de registro -->
            <button type="submit" class="btn text-white w-100"
              style="background-color: #7b5836; font-size: 1rem;">Registrarme</button>

            <!-- Botón de contacto con espacio superior -->
            <div class="text-center mt-3">
              <a href="index.html#contacto" class="btn btn-outline-success">
                <i class='bx bxs-phone'></i> Contacto
              </a>
            </div>


        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-white text-center py-3" style="background-color: #7b5836;">
    <div class="container">
      <p class="mb-1">© 2025 AFROI. Todos los derechos reservados.</p>
      <div>
        <a href="#" class="text-white me-3"><i class='bx bxl-facebook'></i></a>
        <a href="#" class="text-white me-3"><i class='bx bxl-instagram'></i></a>
        <a href="#" class="text-white me-3"><i class='bx bxl-twitter'></i></a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script para días y años -->
  <script>
    // Llenar días
    const diaSelect = document.getElementById('dia');
    for (let d = 1; d <= 31; d++) {
      diaSelect.innerHTML += `<option>${d}</option>`;
    }

    // Llenar años
    const añoSelect = document.getElementById('año');
    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= 1940; y--) {
      añoSelect.innerHTML += `<option>${y}</option>`;
    }
  </script>

</body>

</html>
